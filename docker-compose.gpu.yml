# Use se o PC tiver placa NVIDIA:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
x-gpu: &gpu
  build:
    context: .
    args:
      GPU: "1"
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  live:
    <<: *gpu
  painel:
    <<: *gpu
